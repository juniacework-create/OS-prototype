<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>My OS_PROTOTYPE</title>
  <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@600;700&display=swap" rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>

    body {
      margin: 0;
      height: 100vh;
      background: #3a332e;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 1200px;
      touch-action: manipulation;
    }

    .phone {
      width: 360px;
      height: 780px;
      color: #ece4da;
      border-radius: 40px;
      font-family: sans-serif;
      position: relative;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
      transform-style: preserve-3d;
      transition: transform 0.8s;
    }

    .phone.flipped {
      transform: rotateY(180deg);
    }

    .front, .back {
      position: absolute;
      inset: 0;
      border-radius: 40px;
      padding: 20px;
      box-sizing: border-box;
      backface-visibility: hidden;
    }

    .front {
      background: #1f1c1a;
    }

    .back {
      background: #2b2724;
      transform: rotateY(180deg);
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      color: #a89f94;
      font-size: 13px;
    }

    .clock {
      margin-top: 120px;
      text-align: center;
    }

    .time {
      font-size: 72px;
      color: #ece4da;
    }

    .date {
      font-size: 16px;
      color: #a89f94;
      margin-top: 8px;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 60px;
      text-align: center;
      color: #a89f94;
      font-size: 13px;
    }

    .home {
      position: absolute;
      top: 56px;
      left: 0;
      right: 0;
      bottom: 0;
      background: #1f1c1a;
      padding: 0 20px;
      border-radius: 0 0 40px 40px;
      transition: opacity 0.4s;
    }

    .front.locked .home {
      opacity: 0;
      pointer-events: none;
    }

    .widget {
      background: #2b2724;
      border-radius: 28px;
      padding: 24px;
      margin-top: 8px;
    }

    .greet {
      color: #d9a384;
      font-size: 16px;
    }

    .widget-time {
      color: #ece4da;
      font-size: 56px;
      margin-top: 4px;
    }

    .widget-date {
      color: #a89f94;
      font-size: 15px;
      margin-top: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 0;
      margin-top: 28px;
    }

    .icon {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .icon-box {
      width: 60px;
      height: 60px;
      border-radius: 20px;
      background: #38322e;
      transition: transform 0.2s;
    }

    .icon-box:hover {
      transform: scale(1.1);
    }

    .icon span {
      font-size: 12px;
      color: #a89f94;
    }

    .icon-box.sage     { background: #8fa89a; }
    .icon-box.sky      { background: #c8d3fc; }
    .icon-box.red      { background: #d4a59a; }
    .icon-box.amber    { background: #ebb35e; }
    .icon-box.lavender { background: #a89bc9; }
    .icon-box.creamy   { background: #d9cfb8; }
    .icon-box.teal     { background: #5fa8a3; }
    .icon-box.gear     { background: #8c867f; }

    .dock {
      position: absolute;
      bottom: 24px;
      left: 20px;
      right: 20px;
      display: flex;
      justify-content: space-around;
    }

    .app {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: #38322e;
      transition: transform 0.2s;
    }

    .app:hover {
      transform: scale(1.1);
    }

    .peach {
      background: #d9a384;
    }

    .camera {
      position: relative;
      width: 96px;
      padding: 16px 0 16px 14px;
      box-sizing: border-box;
      border-radius: 40px;
      background: #38322e;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .lens {
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: #1f1c1a;
      border: 4px solid #4a423c;
      box-sizing: border-box;
    }

    .flash {
      position: absolute;
      right: 14px;
      top: 77px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #a89f94;
    }

    .brand {
      position: absolute;
      left: 0;
      right: 0;
      top: 50%;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 30px;
      font-weight: 700;
      color: #ece4da;
    }

    .model {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 40px;
      text-align: center;
      font-family: 'Quicksand', sans-serif;
      font-size: 14px;
      color: #a89f94;
    }

    .btn {
      position: absolute;
      width: 4px;
      background: #38322e;
    }

    .volume {
      right: -4px;
      top: 250px;
      height: 100px;
      border-radius: 0 4px 4px 0;
    }

    .power {
      left: -4px;
      top: 160px;
      height: 56px;
      border-radius: 4px 0 0 4px;
    }

    .flip-btn {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      background: #2b2724;
      color: #ece4da;
      border: none;
      border-radius: 20px;
      padding: 10px 20px;
      font-family: sans-serif;
      cursor: pointer;
    }

    .app-screen { position:absolute; top:56px; left:0; right:0; bottom:0; background:#1f1c1a; padding:0 20px; border-radius:0 0 40px 40px; opacity:0; pointer-events:none; transition:opacity 0.3s; }
    .front.app-open .app-screen { opacity:1; pointer-events:auto; }
    .app-title { font-size:28px; color:#ece4da; margin-top:24px; }
    .app-body { color:#a89f94; margin-top:12px; }
    .home-bar { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:110px; height:5px; padding:10px 0; background:#a89f94; background-clip:content-box; border-radius:3px; cursor:pointer; }
    .mini-row{
      display: flex;
      gap: 12px;
      margin-top: 28px;
    }

    .mini{
      flex: 1;
      background: #2b2724;
      border-radius: 24px;
      padding: 16px;
    }

    .mini-label{
      font-size: 12px;
      color:#a89f94;
    }

    .mini-value{
      font-size: 28px;
      color: #ece4da;
      margin-top: 6px;
    }

    .mini-note{
      font-size: 13px;
      color: #a89f94;
      margin-top: 12px;
    }

    .bar{
      height: 6px;
      background: #38322e;
      border-radius: 3px;
      margin-top: 16px;
    }
    
    .bar-fill{
      width: 60%;
      height: 100%;
      background: #8fa89a;
      border-radius: 3px;
    }
    
    .icon-box{
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-box svg{
      width: 30px;
     height: 30px;
     stroke: #1f1c1a;
     fill: none;
     stroke-width: 2.6;
     stroke-linecap: round;
     stroke-linejoin: round;
    }

    .notes-input {
     display: none;
     width: 100%;
     box-sizing: border-box;
     height: 540px;
     margin-top: 16px;
     background: #2b2724;
     color: #ece4da;
     border: none;
     border-radius: 20px;
     padding: 16px;
     font-family: sans-serif;
     font-size: 16px;
     resize: none;
     outline: none;
     caret-color: #d9a384;
    }

  .notes-input::placeholder {
   color: #a89f94;
  }
  .power{
    cursor: pointer;
  }

  .power::before{
    content: "";
    position: absolute;
    top: -10px;
    bottom: -10px;
    left: -12px;
    right: 0;
  }

  .power:hover{
    background: #4a423c;
  }
  </style>
</head>
<body>
  <div class="phone">

    <!-- FRONT -->
    <div class="front locked">
      <div class="status-bar">
        <span>9:41</span>
        <span>100%</span>
      </div>

      <div class="clock">
        <div class="time">9:41</div>
        <div class="date">Monday, 16 November</div>
      </div>
      <div class="hint">Double tap to wake</div>

      <div class="home">
        <div class="widget">
          <div class="greet">Good morning</div>
          <div class="widget-time">9:41</div>
          <div class="widget-date">Monday, 16 November</div>
        </div>

        <div class="grid">
          <div class="icon"><div class="icon-box sage"><svg viewBox="0 0 24 24"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6 19.8 19.8 0 0 1-3.1-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg></div><span>Phone</span></div>
          <div class="icon"><div class="icon-box sky"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div><span>Messages</span></div>
          <div class="icon"><div class="icon-box red"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg></div><span>Camera</span></div>
          <div class="icon"><div class="icon-box amber"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div><span>Gallery</span></div>
          <div class="icon"><div class="icon-box lavender"><svg viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg></div><span>Music</span></div>
          <div class="icon"><div class="icon-box creamy"><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="8" y1="13" x2="16" y2="13"/><line x1="8" y1="17" x2="16" y2="17"/></svg></div><span>Notes</span></div>
          <div class="icon"><div class="icon-box teal"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></div><span>Browser</span></div>
          <div class="icon"><div class="icon-box gear"><svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="7" y2="6"/><line x1="11" y1="6" x2="20" y2="6"/><circle cx="9" cy="6" r="2"/><line x1="4" y1="12" x2="13" y2="12"/><line x1="17" y1="12" x2="20" y2="12"/><circle cx="15" cy="12" r="2"/><line x1="4" y1="18" x2="8" y2="18"/><line x1="12" y1="18" x2="20" y2="18"/><circle cx="10" cy="18" r="2"/></svg></div><span>Settings</span></div>
        </div>
        <div class="mini-row">
          <div class="mini">
            <div class="mini-label">Battery</div>
            <div class="mini-value">100%</div>
            <div class="bar"><div class="bar-fill"></div></div>
          </div>
          <div class="mini">
            <div class="mini-label">Today</div>
            <div class="mini-value">3 Tasks</div>
            <div class="mini-note">Nothing Urgent</div>
          </div>
        </div>

        <div class="dock">
          <div class="app peach"></div>
          <div class="app"></div>
          <div class="app"></div>
          <div class="app"></div>
        </div>
      </div>

    <div class="app-screen">
      <div class="app-title"></div>
      <div class="app-body">Coming soon</div>
      <textarea class="notes-input" placeholder="Write a note..."></textarea>
      <div class="home-bar"></div>
    </div>
    </div>

    <!-- BACK -->
    <div class="back">
      <div class="camera">
        <div class="lens"></div>
        <div class="lens"></div>
        <div class="lens"></div>
        <div class="flash"></div>
      </div>
      <div class="brand">marsians</div>
      <div class="model">x12e</div>
    </div>

    <!-- SIDE BUTTONS -->
    <div class="btn power"></div>
    <div class="btn volume"></div>
  </div>

  <button class="flip-btn">Flip phone</button>

  <script>
    const phone = document.querySelector('.phone');
    const front = document.querySelector('.front');

    document.querySelector('.flip-btn').addEventListener('click', function () {
      phone.classList.toggle('flipped');
    });
    
    let lastTap = 0;
    front.addEventListener('pointerup', function (){
        const now = Date.now();
        if (now - lastTap < 350){
            front.classList.remove('locked');
        }
        lastTap = now;
    });

    const appTitle = document.querySelector('.app-title');
    document.querySelectorAll('.icon').forEach(function (icon) {
      icon.addEventListener('click', function () {
        appTitle.textContent = icon.querySelector('span').textContent;
        front.classList.add('app-open');
      });
    });
    document.querySelector('.home-bar').addEventListener('click', function () {
      front.classList.remove('app-open');
    });

    function updateClock(){
      const now = new Date();
      const time = now.toLocaleTimeString('en-GB', {hour: '2-digit', minute: '2-digit'});
      const date = now.toLocaleDateString('en-GB', {weekday: 'long', day: 'numeric', month: 'long'});
      const hour = now.getHours();

      let greeting = 'Good evening';
      if (hour < 12) greeting = 'Good morning';
      else if (hour < 18) greeting ='Good afternoon';

      document.querySelector('.status-bar span').textContent = time;
      document.querySelector('.time').textContent = time;
      document.querySelector('.date').textContent = date;
      document.querySelector('.widget-time').textContent = time;
      document.querySelector('.widget-date').textContent = date;
      document.querySelector('.greet').textContent = greeting;
    }

    updateClock();
    setInterval(updateClock, 1000);

    const notesInput =  document.querySelector('.notes-input');
    const appBody = document.querySelector('.app-body');

    notesInput.value = localStorage.getItem('marsians-note') || '';

    notesInput.addEventListener('input', function(){
        localStorage.setItem('marsians-note', notesInput.value);
    });

    document.querySelectorAll('.icon').forEach(function(icon){
        icon.addEventListener('click', function(){
            const isNotes = icon.querySelector('span').textContent === 'Notes';
            notesInput.style.display = isNotes ? 'block' : 'none';
            appBody.style.display = isNotes ? 'none' : 'block';
        });
    });

    document.querySelector('.power').addEventListener('click', function(){
      front.classList.remove('app-open');
      front.classList.toggle('locked');
    });
  </script>
</body>
</html>
